[package]
name = "mork"
version = "0.1.0"
edition = "2024"

[dependencies]
eval = { workspace=true }
eval-ffi = { workspace=true }
mork-frontend = { workspace=true }
mork-expr = { workspace=true }
mork-interning = { workspace = true }
pathmap = { workspace = true, features = ["nightly"] }
linalg = { workspace = true, optional = true, features = ["jit"] }
log = { workspace=true }
env_logger = { workspace=true }
memmap2 = "0.9.5"
#neo4rs = { version = "0.9.0-rc.5" , features = ["unstable-bolt-protocol-impl-v2"]}
#tokio = "1.43.0"
futures = "0.3.31"
neo4rs = { version = "0.9.0-rc.6", optional = true }
tokio = { version = "1.44.0", optional = true }
rand = "0.9.1"
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.225", features = ["derive"] }
wasmtime = { version = "37.0.1", features = ["winch"], optional = true }
itertools = "0.14.0"
base64 = "0.22.1"
hex = "0.4.3"
subprocess = { version = "0.2.13" }

[features]
pathspace_oracles = []
semi_naive_ic = []
stratified_quiescence = []
default = ["grounding", "specialize_io"]
einsum = ["dep:linalg"]
neo4j = ["dep:neo4rs", "dep:tokio"]
interning = []
wasm = ["dep:wasmtime"]
z3 = []
egraph = []
weighted_select = []
factorized_aggregate = [] # experimental: route COUNT/SUM/MIN/MAX/AND sinks to the factorized aggregation engine
compiled_matcher = [] # experimental: route VarRef-free plain queries through the compiled match program (diverges on the HE conformance corpus; keep off until repaired)
leapfrog = [] # experimental: route flat conjunctive exec bodies to the WCO leapfrog join
guarded_emit = [] # experimental: sink-side output filter by schema-table generalization retrieval
retrieval_join = [] # experimental: unifiability retrieval into stored regions as a join-side operation
no_search = []
grounding = []
specialize_io = []
# Sorted-batch emission: batch template outputs per write-zipper group and
# flush sorted (join order is random w.r.t. the trie; sorted insertion into a
# large dish measured 2.65x faster). Per-path insert semantics unchanged.
bulk_emit = []
# Witness selection (Datalog's choice): (choose (TABLE key) out) keeps ONE
# emission per distinct key per firing, so a search over states never
# enumerates the derivations that reach them.
witness_select = ["guarded_emit"]
periodic_merkleize = []
experimental_dnf = ["pathmap/zipper_alg"]
[[example]]
name = "wco_leapfrog"
required-features = ["leapfrog"]

[[test]]
name = "einsum_sink"
path = "tests/einsum_sink.rs"
required-features = ["einsum"]
