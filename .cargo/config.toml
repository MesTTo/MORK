
[build]
#rustflags = "-C opt-level=3 -C target-cpu=native -C lto=fat -C embed-bitcode=yes -Z dylib-lto -Awarnings"
# "--emit", "asm", 

# "opt-level=3" removes debug asserts
# --cfg gxhash switches mork-expr's unify visited-set off the std-SipHash
# miri fallback onto the real gxhash (needs aes, provided by target-cpu=native);
# without it every unify call hashes (ExprEnv, ExprEnv) with SipHash.
rustflags = ["-C", "target-cpu=native", "-Awarnings", "--cfg", "gxhash"]
#rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+aes", "-Awarnings"]

# this allows tests to reference files datasets from the workspace root instead of being forced to work backwards
[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }
